<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jackpot</title>
<meta name="theme-color" content="#1e5239">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jackpot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&display=swap">
<style>
:root{
  --felt:#1e5239; --ivory:#f3e9d2; --ivory-dim:#cfc3a6; --ink:#1b1a17;
  --gold:#e7b84f; --red:#c84b3a; --green:#8fd19e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --felt:#1b4a34; } }
:root[data-theme="dark"]{ --felt:#1b4a34; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100%; background:var(--felt); color:var(--ivory);
  font-family:"Fraunces",Georgia,"Times New Roman",serif;
  background-image:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.07), transparent 60%);
  -webkit-tap-highlight-color:transparent;
}
main{ max-width:480px; margin:0 auto; padding:16px 14px 28px; }
button{ font:inherit; cursor:pointer; }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

header{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; }
h1{ font-size:28px; font-weight:900; margin:0; }
.mode{ display:flex; gap:6px; }
.mode button{ font-size:13px; font-weight:700; padding:6px 10px; border-radius:999px; border:1.5px solid var(--ivory-dim); background:transparent; color:var(--ivory-dim); }
.mode button[aria-pressed="true"]{ background:var(--ivory); color:var(--ink); border-color:var(--ivory); }

/* players */
.players{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; margin-bottom:12px; }
.player{ border:1.5px solid rgba(243,233,210,.25); border-radius:10px; padding:8px 10px; background:rgba(0,0,0,.18); text-align:left; color:var(--ivory); }
.player.active{ border-color:var(--gold); background:rgba(231,184,79,.14); }
.player .name{ font-weight:700; font-size:16px; display:block; }
.player .stats{ font-size:12px; color:var(--ivory-dim); display:block; margin-top:2px; }
.player .at{ display:block; text-align:center; font-size:12px; color:var(--ivory-dim); margin:-2px 0 4px; line-height:1; }
.player .at.lead{ color:var(--gold); }
.player .sess{ display:block; text-align:center; font-size:30px; font-weight:900; color:var(--ivory); margin:4px 0 2px; line-height:1; }
.player .sess small{ display:block; font-size:11px; font-weight:500; color:var(--ivory-dim); margin-top:3px; }
.sessionbar{ display:flex; justify-content:center; gap:8px; margin:0 0 10px; }
.sessionbar button{ font-size:14px; font-weight:700; padding:8px 14px; border-radius:999px; border:1.5px solid var(--ivory-dim); background:transparent; color:var(--ivory); }

.player .stats b{ color:var(--ivory); font-weight:700; }
.nameform{ display:none; gap:8px; margin:0 0 12px; }
.nameform.open{ display:flex; }
.nameform input{ flex:1; font:inherit; font-size:16px; padding:8px 10px; border-radius:8px; border:1.5px solid var(--ivory-dim); background:rgba(0,0,0,.25); color:var(--ivory); min-width:0; }
.nameform button{ font-size:14px; font-weight:700; padding:8px 14px; border-radius:999px; border:0; background:var(--ivory); color:var(--ink); }
.nameform button.cancel{ background:transparent; color:var(--ivory-dim); text-decoration:underline; }
footer button.confirm{ color:var(--red); font-weight:700; }
.playerlinks{ display:flex; justify-content:space-between; }
.alltime{ display:block; margin:-4px 0 6px; font-size:13px; color:var(--ivory-dim); background:none; border:0; width:100%; text-decoration:underline; }
.alltime b{ color:var(--ivory); font-size:20px; font-weight:900; }
.alltime .lead{ color:var(--gold); }


.alltimeform{ display:none; gap:8px; margin:0 0 12px; flex-wrap:wrap; justify-content:center; }
.alltimeform.open{ display:flex; }
.alltimeform .formlabel{ flex-basis:100%; text-align:center; font-size:12px; color:var(--ivory-dim); margin-top:4px; }
.alltimeform label{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--ivory-dim); }
.alltimeform input{ width:70px; font:inherit; font-size:16px; padding:8px; border-radius:8px; border:1.5px solid var(--ivory-dim); background:rgba(0,0,0,.25); color:var(--ivory); text-align:center; }
.alltimeform button{ font-size:14px; font-weight:700; padding:8px 12px; border-radius:999px; border:1.5px solid var(--ivory-dim); background:transparent; color:var(--ivory); }
.alltimeform button.primary{ background:var(--ivory); color:var(--ink); border-color:var(--ivory); }
.addplayer{ display:block; margin:-4px 0 12px; background:none; border:0; color:var(--ivory-dim); font-size:12px; text-decoration:underline; padding:2px 0; }

/* board */
.box{ background:linear-gradient(#5a3a1f,#3f2614); border-radius:14px; padding:12px 8px 10px; box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.35); }
.tiles{ display:grid; grid-template-columns:repeat(9,1fr); gap:5px; touch-action:none; perspective:500px; }
.tile *{ pointer-events:none; }
.tile.down svg{ width:94%; height:auto; display:block; }
.tile{
  font-weight:700; font-size:clamp(18px,6vw,26px); line-height:1; aspect-ratio:1/1.9; border-radius:5px; border:0; color:var(--ink);
  background:linear-gradient(#fff8e6,#e9dcbd); box-shadow:0 3px 0 #b9a985, 0 4px 6px rgba(0,0,0,.3);
  transition:transform .12s, background .12s; padding:10px 0 0; transform-origin:50% 0%; user-select:none; -webkit-user-select:none; display:flex; align-items:flex-start; justify-content:center;
}
.tile.down{ background:linear-gradient(#4a2e1a,#3a2211); color:rgba(243,233,210,.55); box-shadow:inset 0 2px 4px rgba(0,0,0,.6); transform:translateY(3px); align-items:center; padding-top:0; font-size:clamp(16px,5.5vw,24px); }
.tile.can{ box-shadow:0 0 0 3px var(--gold), 0 3px 0 #b9a985, 0 0 18px rgba(231,184,79,.7); transform:translateY(-6px) scale(1.18); position:relative; z-index:2; }
.overlay.kruk{ background:rgba(40,70,140,.88); }
.overlay.kruk span{ font-size:min(16vw,80px); }
.overlay.kruk.big span{ transform:none; }
.overlay.kruk.big svg{ width:min(82vw,60vh); height:auto; display:block; margin:0 auto; filter:drop-shadow(0 12px 24px rgba(0,0,0,.45)); }
.overlay.kruk.big small{ font-size:min(13vw,64px); font-weight:900; letter-spacing:.04em; margin-top:10px; }
.overlay.kruk.big.show{ animation-duration:4.5s; }
.verdict .sub{ color:var(--gold); font-weight:700; margin:0 0 8px; }
.verdict table.sum{ width:100%; border-collapse:collapse; font-size:12px; margin:6px 0 10px; }
.verdict table.sum th{ font-weight:500; color:var(--ivory-dim); font-size:10px; padding:2px; }
.verdict table.sum td{ padding:3px 2px; text-align:center; }
.verdict table.sum td:first-child{ text-align:left; font-weight:700; }
.verdict table.sum small{ color:var(--ivory-dim); font-size:10px; }
.verdict .verdicttxt{ font-size:13px; color:var(--ivory); margin:0 0 10px; }
.verdict.fout .sub{ color:var(--ivory); }
.notice{ margin:8px 0 0; padding:10px 12px; border-radius:10px; background:rgba(40,70,140,.35); border:1.5px solid rgba(140,170,240,.6); font-size:14px; text-align:center; }
.boardstat{ display:flex; justify-content:space-between; margin:8px 4px 0; font-size:13px; color:var(--ivory-dim); }
.boardstat b{ color:var(--ivory); font-weight:700; }
.special{ margin:6px 4px 0; font-size:12px; color:var(--ivory-dim); line-height:1.5; }
.special b{ color:var(--gold); font-weight:700; }
.special .odd{ color:var(--ivory); }
body.nokans .special .odd{ display:none; }
.move .lbl small .pat{ color:var(--gold); }

/* dice */
.dice{ display:flex; justify-content:center; align-items:center; gap:18px; margin:20px 0 6px; position:relative; }
.die{
  width:84px; height:84px; border-radius:16px; border:0; background:linear-gradient(#fffdf6,#efe7d2);
  box-shadow:0 5px 0 #c4b793, 0 8px 14px rgba(0,0,0,.35); display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:12px;
}
.die:active{ transform:translateY(3px); box-shadow:0 2px 0 #c4b793, 0 4px 8px rgba(0,0,0,.35); }
.pip{ width:14px; height:14px; border-radius:50%; background:var(--ink); place-self:center; opacity:0; }
.pip.on{ opacity:1; }
.sum{ font-size:40px; font-weight:900; color:var(--gold); min-width:56px; text-align:center; }
.dicehelp{ text-align:center; font-size:13px; color:var(--ivory-dim); margin:0 0 12px; }
.roll{ display:block; width:100%; max-width:360px; margin:0 auto 16px; font-size:26px; font-weight:900; letter-spacing:.02em; padding:18px 22px; border-radius:16px; border:0; background:var(--gold); color:var(--ink); box-shadow:0 6px 0 #a67c22, 0 10px 20px rgba(0,0,0,.3); }
.roll:active{ transform:translateY(4px); box-shadow:0 2px 0 #a67c22, 0 4px 10px rgba(0,0,0,.3); }

/* moves */
.moves{ display:grid; gap:8px; }
.move{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid rgba(243,233,210,.25); background:rgba(0,0,0,.18); color:var(--ivory); }
.move.best{ border-color:var(--gold); background:rgba(231,184,79,.12); }
.move .num{ font-size:30px; font-weight:900; width:44px; text-align:center; }
.move .lbl{ font-size:14px; }
.move .lbl small{ display:block; color:var(--ivory-dim); font-size:12px; }
.move .odds{ text-align:right; font-size:13px; line-height:1.3; color:var(--ivory-dim); }
.move .odds b{ display:block; font-size:18px; color:var(--ivory); font-weight:700; }

.verdict{ margin-top:8px; padding:18px 16px; border-radius:12px; text-align:center; }
.verdict.fout{ background:rgba(200,75,58,.22); border:1.5px solid var(--red); }
.verdict.jackpot{ background:rgba(231,184,79,.18); border:1.5px solid var(--gold); }
.verdict h2{ margin:0 0 4px; font-size:30px; font-weight:900; }
.verdict h2.bak{ font-size:38px; color:var(--gold); }
.verdict p{ margin:0 0 12px; color:var(--ivory-dim); }
.verdict button{ font-size:16px; font-weight:700; padding:10px 20px; border-radius:999px; border:0; background:var(--ivory); color:var(--ink); }

.undo{ position:absolute; right:0; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ivory-dim); background:transparent; color:var(--ivory); font-size:22px; line-height:1; padding:0; }
.undo:disabled{ opacity:.25; }

/* history */
.hist{ margin-top:26px; }
.hist h3{ font-size:18px; margin:0 0 8px; font-weight:700; }
.summary{ display:grid; grid-template-columns:1fr auto auto auto auto; gap:4px 10px; font-size:13px; margin-bottom:12px; }
.summary span{ color:var(--ivory-dim); }
.summary .h{ font-size:11px; }
.summary b{ font-weight:700; }
.turn{ border-top:1px solid rgba(243,233,210,.18); padding:8px 0; }
.turn summary{ cursor:pointer; font-size:14px; display:flex; justify-content:space-between; gap:8px; list-style:none; }
.turn summary::-webkit-details-marker{ display:none; }
.turn summary .res{ color:var(--ivory-dim); }
.turn summary .res.jp{ color:var(--gold); font-weight:700; }
.dec{ display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:baseline; font-size:13px; padding:5px 0 0 6px; }
.dec .roll-lbl{ color:var(--ivory-dim); }
.dec .opt{ display:inline-block; margin-right:10px; color:var(--ivory-dim); white-space:nowrap; }
.dec .opt.chosen{ color:var(--ivory); font-weight:700; text-decoration:underline; text-decoration-color:var(--gold); }
.dec .opt.miss{ color:var(--red); }
.dec .opt .p{ font-size:11px; }
.empty{ color:var(--ivory-dim); font-size:13px; }

footer{ margin-top:18px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ivory-dim); flex-wrap:wrap; gap:6px; }
footer button{ font-size:13px; background:none; border:0; color:var(--ivory-dim); text-decoration:underline; padding:4px 0; }
.rules{ margin-top:14px; font-size:13px; color:var(--ivory-dim); line-height:1.5; }
.rules summary{ cursor:pointer; color:var(--ivory); }
.install{ margin:0 0 12px; padding:10px 12px; border-radius:10px; background:rgba(231,184,79,.14); border:1.5px solid var(--gold); font-size:13px; line-height:1.45; }
.install b{ display:block; color:var(--gold); margin-bottom:2px; }
.install .other{ color:var(--ivory-dim); }
.install .row{ display:flex; gap:8px; margin-top:6px; }
.install button{ font-size:13px; font-weight:700; padding:6px 12px; border-radius:999px; border:1.5px solid var(--ivory-dim); background:transparent; color:var(--ivory); }
.install button.primary{ background:var(--ivory); color:var(--ink); border-color:var(--ivory); }
body.play .install{ margin-bottom:8px; padding:8px 10px; font-size:12px; }
/* help sheet (? button): rules, manual, origin */
.help{ position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.55); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px)); }
.help[hidden]{ display:none; }
.helpcard{ max-width:480px; margin:0 auto; background:var(--felt); border:1.5px solid var(--gold); border-radius:14px; padding:14px 16px 18px; color:var(--ivory); font-size:14px; line-height:1.5; box-shadow:0 10px 30px rgba(0,0,0,.45); position:relative; }
.helpcard h2{ margin:0 0 4px; font-size:24px; font-weight:900; padding-right:48px; }
.helpcard h3{ margin:18px 0 6px; font-size:17px; font-weight:700; color:var(--gold); }
.helpcard p{ margin:0 0 8px; }
.helpcard ul{ margin:0 0 8px; padding-left:18px; }
.helpcard li{ margin:0 0 6px; }
.helpcard b{ color:var(--gold); font-weight:700; }
.helpcard .x{ position:absolute; top:8px; right:8px; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ivory-dim); background:transparent; color:var(--ivory); font-size:22px; line-height:1; padding:0; }
.helpcard .done{ display:block; margin:18px auto 0; font-size:16px; font-weight:700; padding:10px 24px; border-radius:999px; border:0; background:var(--ivory); color:var(--ink); }
.mode button.help-btn{ width:34px; padding:6px 0; text-align:center; }
.die.blank{ background:linear-gradient(#e6dcc4,#cfc3a6); box-shadow:0 5px 0 #a89c7b, 0 8px 14px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:900; color:rgba(27,26,23,.45); }
.die.picking{ outline:3px solid var(--gold); outline-offset:3px; }
.picker{ display:none; justify-content:center; gap:8px; margin:0 0 12px; }
.picker.open{ display:flex; }
.picker button{ width:46px; height:46px; border-radius:10px; border:0; background:linear-gradient(#fffdf6,#efe7d2); box-shadow:0 3px 0 #c4b793; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:6px; }
.picker .pip{ width:8px; height:8px; }
.hint{ text-align:center; color:var(--ivory-dim); font-size:14px; padding:14px 0; }
@keyframes shake{ 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)} }
@keyframes redflash{ 0%{box-shadow:0 0 0 0 rgba(200,75,58,.9), inset 0 0 0 100px rgba(200,75,58,.5)} 100%{box-shadow:0 0 0 24px rgba(200,75,58,0), inset 0 0 0 100px rgba(200,75,58,0)} }
@keyframes goldflash{ 0%{box-shadow:0 0 0 0 rgba(231,184,79,1), inset 0 0 0 100px rgba(231,184,79,.6)} 100%{box-shadow:0 0 0 40px rgba(231,184,79,0), inset 0 0 0 100px rgba(231,184,79,0)} }
.box.anim-fout{ animation:shake .6s cubic-bezier(.36,.07,.19,.97), redflash 1.2s ease-out; }
.box.anim-jackpot{ animation:goldflash 1.6s ease-out; }
.verdict.pop{ animation:popin .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes popin{ from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
.verdict .alt{ display:block; margin:10px auto 0; background:none; border:0; color:var(--ivory-dim); font-size:13px; text-decoration:underline; padding:2px; }
body.nokans .odds, body.nokans .boardstat, body.nokans .dec .p, body.nokans footer.stratbar, body.nokans .lbl small .adv{ display:none; }
body.nokans .move.best{ border-color:rgba(243,233,210,.25); background:rgba(0,0,0,.18); }
.overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; z-index:20; }
.overlay.show{ animation:overlay 3.6s ease-out forwards; }
.overlay.sticky.show{ animation:overlayin .35s ease-out forwards; pointer-events:auto; cursor:pointer; }
@keyframes overlayin{ from{opacity:0} to{opacity:1} }
.overlay small.jstat{ font-size:min(4.6vw,19px); font-weight:500; margin-top:4px; }
.overlay .tap{ display:block; margin-top:22px; font-size:min(4.5vw,18px); font-weight:500; opacity:.75; }
.overlay.dood{ background:rgba(160,40,30,.85); }
.overlay.jackpot{ background:rgba(231,184,79,.9); }
.overlay span{ font-size:min(26vw,120px); font-weight:900; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.5); transform:rotate(-6deg); text-align:center; line-height:1; }
.overlay span small{ display:block; font-size:min(7vw,32px); font-weight:700; margin-top:14px; }
.overlay span small+small{ margin-top:6px; font-size:min(5.5vw,24px); font-weight:500; }
.overlay.jackpot span{ color:var(--ink); }
@keyframes overlay{ 0%{opacity:0} 6%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
.die.rolling{ animation:tumble .12s linear infinite; }
@keyframes tumble{ 0%{transform:rotate(-8deg) translateY(-2px)} 50%{transform:rotate(8deg) translateY(2px)} 100%{transform:rotate(-8deg) translateY(-2px)} }
body.play{ position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; }
body.play main{ height:100%; display:flex; flex-direction:column; padding-bottom:10px; }
body.play .meer{ display:none; }
body.play #moves{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
body.play .dicehelp{ display:none; }
body.play main{ padding-top:10px; }
body.play header{ margin-bottom:8px; }
body.play h1{ font-size:22px; }
body.play .players{ margin-bottom:6px; gap:6px; }
body.play .player{ padding:5px 8px; }
body.play .player .sess{ font-size:22px; margin:2px 0 0; }
body.play .player .sess small{ font-size:10px; margin-top:1px; }
body.play .player .stats{ font-size:11px; }
body.play .alltime{ margin:0 0 2px; font-size:12px; }
body.play .sessionbar{ margin:0 0 6px; }
body.play .sessionbar button{ padding:5px 12px; font-size:13px; }
body.play .playerlinks{ margin-bottom:4px; }
body.play .addplayer{ margin:0; font-size:11px; }
body.play .box{ padding:8px 6px 6px; }
body.play .boardstat{ margin-top:4px; font-size:12px; }
body.play .special{ margin-top:3px; font-size:11px; line-height:1.3; }
body.play .die{ width:64px; height:64px; padding:9px; border-radius:13px; }
body.play .die .pip{ width:11px; height:11px; }
body.play .sum{ font-size:30px; }
body.play .roll{ font-size:20px; padding:11px 20px; border-radius:13px; box-shadow:0 4px 0 #a67c22, 0 8px 16px rgba(0,0,0,.3); }
body.play .move{ padding:8px 12px; gap:10px; }
body.play .move .num{ font-size:24px; width:36px; }
body.play .verdict{ padding:10px 12px; margin-top:4px; }
body.play .verdict h2{ font-size:24px; }
body.play .verdict h2.bak{ font-size:30px; }
body.play .verdict p{ margin:0 0 6px; font-size:14px; }
body.play .verdict .mini{ width:30px; height:30px; padding:4px; }
body.play .verdict .mini .pip{ width:6px; height:6px; }
body.play .verdict button{ padding:8px 18px; font-size:15px; }
body.play .verdict .alt{ margin-top:6px; font-size:12px; }
body.play .undo{ width:38px; height:38px; font-size:19px; }
body.play .hint{ padding:8px 0; }
body.play .dice{ margin:14px 0 18px; }
body.play .roll{ margin:0 auto 10px; }
body.play .picker.open{ margin:-6px 0 14px; }
.medal{ display:inline-block; width:18px; height:24px; vertical-align:middle; margin-left:2px; }
.overlay.jackpot.big span{ transform:none; position:relative; }
.overlay.jackpot.big .bigmedal{ width:min(70vw,52vh); height:auto; display:block; margin:0 auto 6px; filter:drop-shadow(0 12px 24px rgba(0,0,0,.35)); animation:medalspin 1.1s cubic-bezier(.2,1.3,.4,1); }
@keyframes medalspin{ from{transform:scale(.2) rotate(-30deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
.overlay.jackpot.big .title{ font-size:min(14vw,68px); display:block; }
.overlay.jackpot.big .supersp{ font-size:min(11vw,52px); color:#c84b3a; margin-top:10px; animation:superpulse .7s ease-in-out infinite alternate; }
@keyframes superpulse{ from{transform:scale(1) rotate(-3deg)} to{transform:scale(1.12) rotate(3deg)} }
.overlay.jackpot.big small{ font-size:min(6.5vw,30px); }
.overlay.jackpot.big small+small{ font-size:min(5.2vw,24px); font-weight:500; }
.overlay.jackpot.big.show{ animation-duration:8s; }
.overlay .ownface{ width:min(46vw,220px); height:min(46vw,220px); border-radius:50%; background:radial-gradient(#5a3a1f,#3a2211); margin:0 auto 10px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; box-shadow:0 0 0 6px var(--gold), 0 14px 30px rgba(0,0,0,.4); animation:facepop .8s cubic-bezier(.2,1.4,.4,1); }
.overlay .ownface svg{ width:78%; height:auto; display:block; margin-bottom:-6%; }
@keyframes facepop{ from{transform:scale(.3);opacity:0} to{transform:scale(1);opacity:1} }
.qrbox{ background:#fff; padding:10px; border-radius:12px; display:inline-block; margin:8px auto 4px; }
.qrbox svg{ display:block; width:min(56vw,220px); height:auto; }
.qrcode{ font-size:12px; color:var(--ivory-dim); margin:0 0 8px; }
.scanbox{ position:fixed; inset:0; background:#000; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; }
.scanbox.open{ display:flex; }
.scanbox video{ width:100%; max-width:480px; max-height:70vh; object-fit:cover; }
.scanbox p{ color:#fff; margin:12px; text-align:center; font-size:14px; }
.scanbox button{ font-size:16px; font-weight:700; padding:10px 22px; border-radius:999px; border:0; background:var(--ivory); color:var(--ink); margin:6px; }
.scanbox input{ font:inherit; font-size:16px; padding:8px 12px; border-radius:8px; border:0; width:220px; text-align:center; }
.overlay .dicerow{ display:flex; justify-content:center; gap:14px; margin:16px 0 4px; }
.overlay .mini{ width:54px; height:54px; border-radius:11px; background:linear-gradient(#fffdf6,#efe7d2); display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:8px; box-shadow:0 4px 0 #c4b793; transform:none; }
.overlay .mini .pip{ width:9px; height:9px; }
.verdict .mini{ display:inline-grid; width:40px; height:40px; border-radius:8px; background:linear-gradient(#fffdf6,#efe7d2); grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:6px; vertical-align:middle; margin:0 3px; box-shadow:0 3px 0 #c4b793; }
.verdict .mini .pip{ width:7px; height:7px; }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } .overlay.show{ opacity:1; } }

<div class="overlay" id="overlay" aria-hidden="true"><span id="overlayText"></span></div>
<div class="scanbox" id="scanbox"><video id="scanvideo" playsinline muted></video><p id="scanmsg" data-i18n="scanAim"></p><div><input id="scancode" data-i18n-placeholder="scanType"><button id="scanOk" data-i18n="scanTake"></button></div><button id="scanClose" data-i18n="close"></button></div>
<div class="help" id="help" hidden role="dialog" aria-modal="true"><div class="helpcard" id="helpcard"></div></div>
<main>
<header>
  <h1>Jackpot</h1>
  <div class="mode" role="group" data-i18n-aria="view">
    <button id="mLang" aria-pressed="false">EN</button>
    <button id="mKans" aria-pressed="false" data-i18n="odds"></button>
    <button id="mSound" aria-pressed="true" data-i18n-aria="sound">🔊</button>
    <button id="mView" aria-pressed="false"></button>
    <button id="mHelp" class="help-btn" aria-pressed="false" data-i18n-aria="help">?</button>
  </div>
</header>
<div class="install" id="install" hidden></div>

<div class="players" id="players"></div>
<div class="nameform" id="nameform"><input id="nameInput" type="text" maxlength="20" data-i18n-placeholder="name" autocomplete="off"><button id="nameOk" data-i18n="save"></button><button class="cancel" id="nameCancel" data-i18n="cancel"></button></div>
<button class="alltime" id="alltime" data-i18n-title="alltimeTitle"></button>
<div class="alltimeform" id="alltimeform"></div>
<div class="sessionbar" id="sessionbar" style="display:none"><button id="endSession" data-i18n="endSession"></button><button id="shareStand" data-i18n="shareStand"></button></div>
<div class="playerlinks"><button class="addplayer" id="addPlayer" data-i18n="addPlayer"></button><button class="addplayer" id="notUs" data-i18n="notUs"></button></div>
<div class="nameform" id="twoform"><input id="twoA" type="text" maxlength="20" data-i18n-placeholder="player1" autocomplete="off"><input id="twoB" type="text" maxlength="20" data-i18n-placeholder="player2" autocomplete="off"><button id="twoOk" data-i18n="save"></button><button class="cancel" id="twoCancel" data-i18n="cancel"></button></div>

<section class="box" data-i18n-aria="board"><div class="tiles" id="tiles"></div></section>
<div class="boardstat">
  <span><span data-i18n="jackpot"></span> <b id="pj">–</b></span>
  <span><b id="es">–</b> <span data-i18n="sips"></span></span>
  <span><span data-i18n="net"></span> <b id="net">–</b></span>
</div>
<div class="special" id="special"></div>

<section data-i18n-aria="dice">
  <div class="dice">
    <button class="die" id="d1"></button>
    <div class="sum" id="sum">7</div>
    <button class="die" id="d2"></button>
    <button class="undo" id="undo" data-i18n-aria="undo" data-i18n-title="undo">↶</button>
  </div>
  <div class="picker" id="picker" data-i18n-aria="pickPips"></div>
  <p class="dicehelp" data-i18n="diceHelp"></p>
  <button class="roll" id="roll" data-i18n="roll"></button>
</section>

<section id="moves" class="moves" aria-live="polite"></section>


<div class="meer" id="meer">
<section class="hist" id="hist"></section>
<footer>
  <span data-i18n="variant"></span>
  <div class="mode" role="group" data-i18n-aria="variantAria">
    <button id="mNormal" aria-pressed="true" data-i18n="normal"></button>
    <button id="mExtreme" aria-pressed="false" data-i18n="extreme"></button>
  </div>
</footer>

<footer class="stratbar">
  <span id="strat"></span>
  <button id="toggleStrat"></button>
</footer>
<footer>
  <button id="resetScores" data-i18n="clearScores"></button>
  <button id="reset" data-i18n="resetBoard"></button>
</footer>

<details class="rules">
  <summary data-i18n="rules"></summary>
  <span data-i18n="rulesText"></span>
</details>
<details class="rules" id="installHelp">
  <summary data-i18n="installHelp"></summary>
  <div><b data-i18n="installAndroidLbl"></b> <span data-i18n="installAndroid"></span></div>
  <div><b data-i18n="installIosLbl"></b> <span data-i18n="installIos"></span></div>
</details>
</div>
</main>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;

      var a=parseFloat(el("atS").value), d=parseFloat(el("atD").value); if(!isNaN(a))S.alltime.stijn=a; if(!isNaN(d))S.alltime.daan=d;
      Array.prototype.forEach.call(el("alltimeform").querySelectorAll(".sj"),function(inp){ var v=parseInt(inp.value,10), i=parseInt(inp.getAttribute("data-i"),10); if(!isNaN(v)&&S.players[i])S.players[i].jackpots=v; });
      el("alltimeform").className="alltimeform"; renderAll(); return;
    }
    var bump=b.getAttribute("data-bump"); if(!bump)return;
    if(bump==="s")S.alltime.stijn=(S.alltime.stijn||0)+1; else if(bump==="d")S.alltime.daan=(S.alltime.daan||0)+1; else { S.alltime.stijn=(S.alltime.stijn||0)+0.5; S.alltime.daan=(S.alltime.daan||0)+0.5; }
    buildForm(); renderAll();
  });
  function sessionStats(){
    return S.players.map(function(p,i){
      var st={name:p.name,turns:0,dood:0,slokken:p.slokken,jackpots:p.jackpots,atjes:p.atjes,kruk:p.kruk||0,medals:(p.medals||[]).length,dec:0,opt:0};
      S.turns.forEach(function(tr){ if(tr.player!==i)return; st.turns++; if(tr.result==="fout")st.dood++; tr.decisions.forEach(function(d){st.dec++; if(d.chosen===d.best)st.opt++;}); });
      return st;
    });
  }
  function luckLabel(z){ return z<-1.5?"bad":z<-0.5?"meh":z<0.5?"normal":z<1.5?"good":z<2.5?"great":"legend"; }
  function endPreview(){
    var sd=sdIdx(); if(!sd)return;
    var p0=S.players[sd.s], p1=S.players[sd.d], line, ns=S.alltime.stijn||0, nd=S.alltime.daan||0;
    if(p0.jackpots>p1.jackpots){ ns+=1; line=t("pointFor",{n:"Stijn"}); } else if(p1.jackpots>p0.jackpots){ nd+=1; line=t("pointFor",{n:"Daan"}); } else { ns+=0.5; nd+=0.5; line=t("draw"); }
    var T=cur(), pj=T.PJ[2][FULL], es=T.ES[2][FULL];
    function luck(x){ var e=x.turns*pj, sd=Math.sqrt(Math.max(e*(1-pj),0.25)); var z=(x.jackpots-e)/sd; var ds=(x.turns*es-x.slokken)/Math.max(1,Math.sqrt(x.turns)*1.8); return {e:e,z:0.65*z+0.35*ds,es:x.turns*es}; }
    var tot={turns:0,jackpots:0,slokken:0}; sessionStats().forEach(function(x){tot.turns+=x.turns;tot.jackpots+=x.jackpots;tot.slokken+=x.slokken;});
    var L=luck(tot), zTot=L.z;
    var catKey=luckLabel(zTot), cat=t("luck")[catKey], stat=t("expected",{e:num(L.e),t:tot.turns+" "+(tot.turns===1?t("turn"):t("hTurns")),j:tot.jackpots});
    var verdict=t("luckVerdict")[catKey].replace("{stat}",stat);
    var st=sessionStats(), rows=st.map(function(x){
      var l=luck(x);
      return '<tr><td>'+esc(x.name)+'</td><td>'+x.jackpots+'<small>/'+num(l.e)+'</small></td><td>'+x.turns+'</td><td>'+x.slokken+'<small>/'+Math.round(l.es)+'</small></td><td>'+x.atjes+'</td><td>'+x.kruk+'</td><td>'+(x.dec?pct(x.opt/x.dec,0):"–")+'</td><td>'+(x.turns?esc(t("luck")[luckLabel(l.z)]):"–")+'</td></tr>';
    }).join("");
    var box=el("moves");
    box.innerHTML='<div class="verdict jackpot pop"><h2>'+esc(t("session"))+'</h2>'+
      '<table class="sum"><tr><th></th><th>'+esc(t("jackpotLc"))+'</th><th>'+esc(t("hTurns"))+'</th><th>'+esc(t("sips"))+'</th><th>'+esc(t("chugs"))+'</th><th>'+esc(t("stool"))+'</th><th>'+esc(t("hOptimal"))+'</th><th>'+esc(t("hLuck"))+'</th></tr>'+rows+'</table><p class="sub">'+esc(t("sessionIs",{c:cat}))+'</p><p class="verdicttxt">'+esc(verdict)+'</p>'+
      '<p class="sub">'+esc(line)+'</p><p>'+t("becomes",{a:'<b>'+fmtAt(ns)+'</b>',b:'<b>'+fmtAt(nd)+'</b>'})+'</p>'+
      '<button id="endOk">'+esc(t("settle"))+'</button><button class="alt" id="endCancel">'+esc(t("cancel"))+'</button></div>';
    el("endCancel").onclick=function(){ renderAll(); };
    el("endOk").onclick=function(){
      S.alltime.stijn=ns; S.alltime.daan=nd; S.alltimeStamp=Date.now();
      play_("jackpot");
      S.players.forEach(function(p){p.slokken=0;p.jackpots=0;p.atjes=0;p.kruk=0;p.medals=[];}); S.turns=[]; S.decisions=[]; S.ended=null; S.board=FULL; S.d1=null; S.d2=null; S.active=0; S.streak=[]; S.kruk=0;
      renderAll(); showQrPanel(line);
    };
    if(S.view==="play") box.scrollTop=0;
  }
  el("endSession").onclick=endPreview;
  function standCode(){ return "JP1|"+(S.alltime.stijn||0)+"|"+(S.alltime.daan||0)+"|"+(S.alltimeStamp||0); }
  function parseCode(c){ var m=/JP1\|([\d.,]+)\|([\d.,]+)\|(\d+)/.exec(String(c||"").trim()); if(!m)return null; return {stijn:parseFloat(m[1].replace(",",".")),daan:parseFloat(m[2].replace(",",".")),stamp:parseInt(m[3],10)}; }
  function qrSvg(text){ try{ var q=qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ return ""; } }
  function showQrPanel(line){
    var box=el("moves");
    box.innerHTML='<div class="verdict jackpot pop"><h2>'+esc(t("sessionClosed"))+'</h2><p class="sub">'+esc(line||"")+'</p><p>'+t("vs",{a:'<b>'+fmtAt(S.alltime.stijn)+'</b>',b:'<b>'+fmtAt(S.alltime.daan)+'</b>'})+'</p>'+
      '<p style="margin:0 0 4px">'+esc(t("scanWith"))+'</p><div class="qrbox">'+qrSvg(standCode())+'</div><p class="qrcode">'+esc(t("orType",{c:standCode()}))+'</p>'+
      '<button id="qrDone">'+esc(t("cont"))+'</button></div>';
    el("qrDone").onclick=function(){ renderAll(); };
  }
  function applyCode(c){
    var d=parseCode(c); if(!d){ el("scanmsg").textContent=t("badCode"); return false; }
    S.alltime.stijn=d.stijn; S.alltime.daan=d.daan; S.alltimeStamp=d.stamp; save(); closeScanner(); renderAll();
    overlay("jackpot",t("taken"),[t("vs",{a:fmtAt(d.stijn),b:fmtAt(d.daan)})],3000); return true;
  }
  var scanStream=null, scanTimer=null;
  function closeScanner(){ el("scanbox").className="scanbox"; clearInterval(scanTimer); if(scanStream){ scanStream.getTracks().forEach(function(tk){tk.stop();}); scanStream=null; } }
  function openScanner(){
    var sb=el("scanbox"); sb.className="scanbox open"; el("scancode").value=""; el("scanmsg").textContent=t("scanAim");
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.BarcodeDetector){ el("scanmsg").textContent=t("noCam"); return; }
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(st){
      scanStream=st; var v=el("scanvideo"); v.srcObject=st; v.play();
      var det=new BarcodeDetector({formats:["qr_code"]});
      scanTimer=setInterval(function(){ det.detect(v).then(function(codes){ if(codes.length&&parseCode(codes[0].rawValue)) applyCode(codes[0].rawValue); }).catch(function(){}); },400);
    }).catch(function(){ el("scanmsg").textContent=t("noCam2"); });
  }
  el("scanClose").onclick=closeScanner;
  el("scanOk").onclick=function(){ applyCode(el("scancode").value); };
  el("shareStand").onclick=function(){ showQrPanel(""); };
  function standText(){ return t("standText",{a:fmtAt(S.alltime.stijn||0),b:fmtAt(S.alltime.daan||0)}); }
  el("mView").onclick=function(){ S.view=S.view==="play"?"meer":"play"; setMode(); };
  el("mLang").onclick=function(){ S.lang=S.lang==="nl"?"en":"nl"; applyLang(); setStratLabels(); setMode(); };
  el("nameCancel").onclick=closeName;
  el("nameOk").onclick=function(){
    var nm=el("nameInput").value.trim(); if(!nm){closeName();return;}
    if(nameTarget===null) S.players.push({name:nm,slokken:0,jackpots:0,atjes:0,kruk:0}); else S.players[nameTarget].name=nm;
    closeName(); renderAll();
  };
  el("nameInput").addEventListener("keydown",function(e){ if(e.key==="Enter")el("nameOk").onclick(); if(e.key==="Escape")closeName(); });
  el("undo").onclick=function(){
    var d=S.decisions[S.decisions.length-1]; if(!d||S.ended||flipping)return;
    var tl=el("tiles").querySelector('.tile[data-i="'+d.chosen+'"]');
    flipTile(tl,d.chosen,0.5);
  };
  el("d1").onclick=function(){ if(S.ended)return; pick=(pick===1?null:1); renderAll(); };
  el("d2").onclick=function(){ if(S.ended)return; pick=(pick===2?null:2); renderAll(); };
  el("picker").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b||!pick)return;
    var v=parseInt(b.getAttribute("data-v"),10);
    if(pick===1){S.d1=v; pick=S.d2?null:2;} else {S.d2=v; pick=S.d1?null:1;}
    fresh=!!(S.d1&&S.d2); if(fresh){play_("flip");registerRoll();}
    renderAll();
  });
  el("roll").onclick=function(){
    if(S.ended||rolling)return;
    rolling=true; pick=null; play_("rattle");
    var n=0, iv=setInterval(function(){
      S.d1=1+Math.floor(Math.random()*6); S.d2=1+Math.floor(Math.random()*6); n++;
      renderDice(); el("sum").textContent="";
      if(n>=12){ clearInterval(iv); rolling=false; fresh=true; registerRoll(); renderAll(); }
    },70);
  };
  el("mSound").onclick=function(){ S.sound=!S.sound; el("mSound").textContent=S.sound?"🔊":"🔇"; el("mSound").setAttribute("aria-pressed",String(S.sound)); ctx(); save(); };
  el("reset").onclick=function(){S.board=FULL;S.decisions=[];S.ended=null;S.d1=null;S.d2=null;pick=null;fresh=false;S.kruk=0;renderAll();};
  el("mKans").onclick=function(){ S.kans=!S.kans; setMode(); };
  var confirmTimer=null;
  el("resetScores").onclick=function(){
    var b=el("resetScores");
    if(!b.classList.contains("confirm")){
      b.classList.add("confirm"); b.textContent=t("clearSure");
      clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ b.classList.remove("confirm"); b.textContent=t("clearScores"); },4000);
      return;
    }
    clearTimeout(confirmTimer); b.classList.remove("confirm"); b.textContent=t("clearScores");
    S.players.forEach(function(p){p.slokken=0;p.jackpots=0;p.atjes=0;p.kruk=0;p.medals=[];}); S.turns=[]; S.streak=[]; S.kruk=0; S.decisions=[]; S.ended=null; S.board=FULL; S.d1=null; S.d2=null; S.active=0; renderAll();
  };
  el("mNormal").onclick=function(){S.extreme=false;setMode();};
  el("mExtreme").onclick=function(){S.extreme=true;setMode();};
  function setMode(){
    el("mNormal").setAttribute("aria-pressed",String(!S.extreme));
    el("mExtreme").setAttribute("aria-pressed",String(S.extreme));
    el("mKans").setAttribute("aria-pressed",String(S.kans));
    document.body.className=(S.kans?"":"nokans")+(S.view==="play"?" play":"");
    el("mView").textContent=S.view==="play"?t("more"):t("game"); el("mView").setAttribute("aria-pressed",String(S.view!=="play"));
    el("mSound").textContent=S.sound?"🔊":"🔇"; el("mSound").setAttribute("aria-pressed",String(S.sound));
    renderAll();
  }
  function setStratLabels(){
    if(S.strat!==0&&S.strat!==1&&S.strat!==2)S.strat=2;
    var ST=t("strat");
    el("strat").textContent=t("adviceLbl",{s:ST[S.strat]});
    el("toggleStrat").textContent=t("switchTo",{s:ST[(S.strat+1)%3].split(" (")[0]});
  }
  el("toggleStrat").onclick=function(){S.strat=(S.strat+1)%3;setStratLabels();renderAll();};
  applyLang(); setStratLabels(); setMode();
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
