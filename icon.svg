<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e6"/><stop offset="1" stop-color="#e9dcbd"/></linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#efe7d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1e5239"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <!-- tile with the J -->
  <g transform="rotate(-6 250 224)" filter="url(#shadow)">
    <rect x="165" y="82" width="170" height="300" rx="13" fill="#b9a985"/>
    <rect x="165" y="74" width="170" height="300" rx="13" fill="url(#ivory)"/>
    <text x="250" y="294" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="200" fill="#e7b84f" stroke="#1b1a17" stroke-width="6" paint-order="stroke">J</text>
  </g>
  <!-- die showing 6 -->
  <g transform="rotate(14 334 353)" filter="url(#shadow)">
    <rect x="281" y="307" width="106" height="106" rx="21" fill="#c4b793"/>
    <rect x="281" y="300" width="106" height="106" rx="21" fill="url(#die)"/>
    <g fill="#1b1a17"><circle cx="307.5" cy="326.5" r="9"/><circle cx="360.5" cy="326.5" r="9"/><circle cx="307.5" cy="353" r="9"/><circle cx="360.5" cy="353" r="9"/><circle cx="307.5" cy="379.5" r="9"/><circle cx="360.5" cy="379.5" r="9"/></g>
  </g>
  <!-- die showing 1 -->
  <g transform="rotate(-11 163 374)" filter="url(#shadow)">
    <rect x="115" y="333" width="96" height="96" rx="19" fill="#c4b793"/>
    <rect x="115" y="326" width="96" height="96" rx="19" fill="url(#die)"/>
    <circle cx="163" cy="374" r="8.2" fill="#1b1a17"/>
  </g>
</svg>
